services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"


  elastic-consumer:
    build: ./Consumer
    container_name: elastic-consumer

    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: events

      # מתחבר ל-RabbitMQ של הפרויקט rabitPython
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5673

      RABBITMQ_EXCHANGE: alerts.exchange
      RABBITMQ_QUEUE: elastic-warning-queue
      RABBITMQ_ROUTING_KEY: alert.warning

    depends_on:
      - elasticsearch

    restart: unless-stopped